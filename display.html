<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>交換禮物 — 大螢幕</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap">
  <link rel="stylesheet" href="assets/style.css?v=18">
</head>
<body>
  <main class="display">
    <header>
      <h1><span class="emoji">🎁</span> 今天的禮物們</h1>
      <span class="count" id="count"></span>
      <div class="toolbar">
        <!-- 顯示模式與速度改由管理後台設定 -->
        <button class="small ghost" id="qrBtn" title="快捷鍵 Q">QR code</button>
        <button class="small ghost" id="fsBtn" title="快捷鍵 F">全螢幕</button>
      </div>
    </header>

    <section class="grid" id="grid"><div class="empty">載入中…</div></section>
    <section class="carousel" id="carousel" hidden>
      <canvas class="snow" id="snow"></canvas>
      <div class="marquee" id="marquee"></div>
      <div class="spot" id="spot"></div>
    </section>
  </main>

  <div class="qr-box" id="qrBox">
    <div id="qr"></div>
    掃我填寫禮物特徵
  </div>

  <div class="status-dot" id="status"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="assets/config.js"></script>
  <script src="assets/api.js"></script>
  <script>
    var cfg = window.APP_CONFIG;
    var gifts = [];
    var seen = new Set();
    var firstLoad = true;
    var lastRevealAt = 0;
    var lastResetAt = 0;
    var mode = 'all';
    var carouselSec = cfg.CAROUSEL_SEC || 6;     // 按 ← → 放大禮物時停留的秒數
    var speedLevel = cfg.MARQUEE_SPEED || 3;     // 動態展示移動速度 1～10（由後台設定）
    var lastSig = '';
    var revealOpen = false;
    var lastDisplaySig = null;                   // 後台顯示設定，變了才套用

    // 後台還沒設定過時，先沿用這台電腦上次的模式
    try { mode = localStorage.getItem('display_mode') || 'all'; } catch (e) {}

    var gridEl = document.getElementById('grid');
    var carEl = document.getElementById('carousel');
    var countEl = document.getElementById('count');
    var statusEl = document.getElementById('status');

    /* ---------- QR code ---------- */
    var formUrl = new URL('index.html', location.href).href;
    var qrBox = document.getElementById('qrBox');
    var qrState = 0; // 0 小, 1 大, 2 隱藏
    function drawQr() {
      var el = document.getElementById('qr');
      el.innerHTML = '';
      var size = qrState === 1 ? Math.min(window.innerWidth, window.innerHeight) * 0.6 : 150;
      if (window.QRCode) new QRCode(el, { text: formUrl, width: size, height: size, correctLevel: QRCode.CorrectLevel.M });
      else el.textContent = formUrl;
      qrBox.className = 'qr-box' + (qrState === 1 ? ' big' : '') + (qrState === 2 ? ' hidden' : '');
      document.body.classList.toggle('qr-small', qrState === 0);
    }
    function cycleQr() { qrState = (qrState + 1) % 3; drawQr(); if (typeof fitGrid === 'function') fitGrid(); }
    drawQr();
    qrBox.addEventListener('click', cycleQr);
    document.getElementById('qrBtn').addEventListener('click', cycleQr);

    /* ---------- 卡片 ---------- */
    function cardHtml(g, extraClass) {
      var words = g.words.map(function (w, i) {
        var fake = g.revealed && g.fakeIndex === i;
        return '<li class="' + (fake ? 'fake' : '') + '">' + escapeHtml(w) + '</li>';
      }).join('');
      var owner = g.revealed ? '<div class="owner">🎅 ' + escapeHtml(g.name) + ' 的禮物</div>' : '';
      return '<article class="gift-card ' + (g.revealed ? 'revealed ' : '') + (extraClass || '') + '" data-id="' + g.id + '">' +
        '<div class="no">禮物 #' + g.id + '</div><ul>' + words + '</ul>' + owner + '</article>';
    }

    /* 依可用空間算出最佳欄數與字級，讓卡片填滿整個螢幕 */
    var MIN_U = 12, MAX_U = 60;
    function applyFit(cols, rowH, u) {
      var s = gridEl.style;
      s.gridTemplateColumns = 'repeat(' + cols + ', minmax(0, 1fr))';
      s.gridAutoRows = rowH ? rowH + 'px' : 'auto';
      s.setProperty('--word-size', u + 'px');
      s.setProperty('--no-size', Math.max(12, u * .72) + 'px');
      s.setProperty('--pad', Math.max(10, u * .7) + 'px');
    }

    function fitGrid() {
      var cards = gridEl.querySelectorAll('.gift-card');
      var n = cards.length;
      if (!n || gridEl.hidden) return;
      var W = gridEl.clientWidth;
      var H = window.innerHeight - gridEl.getBoundingClientRect().top - 30;
      var gap = W > 1200 ? 18 : 12;
      gridEl.style.gap = gap + 'px';
      var anyRevealed = gifts.some(function (g) { return g.revealed; });
      var k = anyRevealed ? 8.4 : 7.2; // 卡片高度 ≈ k × 字級 + 固定留白
      var qrW = 0, qrH = 0;
      if (qrState === 0) { qrW = qrBox.offsetWidth + 20; qrH = qrBox.offsetHeight + 20; }

      // 最長的詞約幾個字寬（中文 1、英數 0.55），最多算 8 個字，更長的允許換行
      var longest = 0;
      gifts.forEach(function (g) {
        g.words.forEach(function (w) {
          var len = 0;
          for (var ch of String(w)) len += /[\u0000-ÿ]/.test(ch) ? .55 : 1;
          if (len > longest) longest = len;
        });
      });
      var L = Math.max(3, Math.min(8, longest)) + 2.6; // + 左右留白與 ✦ 符號

      // 每種欄數算出列高與字級上限
      var cands = [];
      for (var cols = 1; cols <= Math.min(n, 60); cols++) {
        var rows = Math.ceil(n / cols);
        var w = (W - gap * (cols - 1)) / cols;
        // 最後一列空出的位置不夠放 QR code 時，底部留出 QR 的高度
        var emptyW = (rows * cols - n) * (w + gap);
        var availH = emptyW >= qrW ? H : H - qrH;
        var h = Math.floor((availH - gap * (rows - 1)) / rows);
        var ub = Math.min(MAX_U, (h - 30) / k, w / L);
        if (ub >= MIN_U) cands.push({ cols: cols, h: h, ub: ub });
      }
      cands.sort(function (a, b) { return b.ub - a.ub; });

      function fits(c, u) {
        applyFit(c.cols, c.h, u);
        // 只看高度：角落緞帶會超出卡片寬度（被裁掉），不能當成溢出；中文會自動換行
        return !Array.prototype.some.call(cards, function (el) {
          return el.scrollHeight > el.clientHeight + 1;
        });
      }
      // 依序實際排版檢查；估算偏大（例如超長詞換行）時再縮小字級
      var best = null;
      for (var i = 0; i < cands.length && i < 4; i++) {
        var c = cands[i];
        if (best && c.ub <= best.u) break; // 剩下的不可能更好
        var u = c.ub;
        while (u > MIN_U && !fits(c, u)) u = Math.max(MIN_U, u * .92);
        if (fits(c, u) && (!best || u > best.u)) best = { cols: c.cols, h: c.h, u: u };
      }

      if (best) applyFit(best.cols, best.h, best.u);
      else applyFit(Math.max(1, Math.floor(W / 160)), 0, MIN_U); // 太多份：不固定列高，允許捲動
    }

    function renderGrid() {
      if (!gifts.length) {
        gridEl.style.gridTemplateColumns = '';
        gridEl.style.gridAutoRows = '';
        gridEl.innerHTML = '<div class="empty">還沒有人填寫喔～<br>掃描右下角 QR code 開始吧！</div>';
        return;
      }
      // 排隊等著飛進來的禮物先隱藏，飛到位後才顯示
      gridEl.innerHTML = gifts.map(function (g) {
        return cardHtml(g, pending.has(g.id) ? 'landing' : '');
      }).join('');
      fitGrid();
    }

    var resizeTimer = null;
    window.addEventListener('resize', function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function () {
        if (qrState === 1) drawQr();
        if (mode === 'all') fitGrid(); else { buildMarquee(); sizeSnow(); }
      }, 150);
    });

    /* ---------- 動態展示：跑馬燈禮物牆（← → 可手動放大某份禮物） ---------- */
    var marqueeEl = document.getElementById('marquee');
    var spotEl = document.getElementById('spot');
    var MQ_SPEED = speedLevel * 15;   // 跑馬燈速度（px/秒），等級 3 = 45px/秒
    var FRESH_SEC = 90;         // 新禮物在牆上發光標示 NEW 的秒數（至少跑完一圈，確保會經過畫面）
    var spotIdx = -1, spotTimer = null;
    var freshAt = {};           // 禮物 id → 飛進來的時間
    var mqShown = {};           // 目前在禮物牆上的禮物：id → JSON（用來判斷要不要局部更新）
    var reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

    function wantRows(n) {
      var H = window.innerHeight - carEl.getBoundingClientRect().top - 24;
      return Math.min(n, H > 640 ? 3 : 2);
    }
    function trackAnim(t) { return t.getAnimations && t.getAnimations()[0]; }
    function trackX(t) { return new DOMMatrix(getComputedStyle(t).transform).m41; }
    // 把某一列移到指定的位移（px），換算成動畫時間
    function setTrackX(t, x) {
      var a = trackAnim(t);
      if (!a) return;
      var half = Number(t.dataset.half);
      var p = -x / half;
      if (t.dataset.dir === 'reverse') p = 1 - p;
      p = ((p % 1) + 1) % 1;
      a.currentTime = p * a.effect.getComputedTiming().duration;
    }

    function buildMarquee() {
      // 已經在牆上或排隊飛入中的不放進來，等輪到時再插入
      var list0 = gifts.filter(function (g) { return !pending.has(g.id); });
      mqShown = {};
      if (!list0.length) {
        marqueeEl.innerHTML = gifts.length ? '' : '<div class="empty">還沒有人填寫喔～<br>掃描右下角 QR code 開始吧！</div>';
        return;
      }
      var H = window.innerHeight - carEl.getBoundingClientRect().top - 24;
      var W = carEl.clientWidth || window.innerWidth;
      var rows = wantRows(list0.length);
      var gap = W > 1200 ? 22 : 14;
      var rh = Math.floor((H - gap * (rows - 1)) / rows);
      var cw = Math.round(rh * 1.3);
      // 預留公佈後「主人名字」那一行的高度，之後局部更新也不會溢出
      var u = Math.max(12, Math.min(40, (rh - 30) / 8.4));
      var s = marqueeEl.style;
      s.setProperty('--mq-gap', gap + 'px');
      s.setProperty('--mq-w', cw + 'px');
      s.setProperty('--mq-h', rh + 'px');
      s.setProperty('--word-size', u + 'px');
      s.setProperty('--no-size', Math.max(12, u * .72) + 'px');
      s.setProperty('--pad', Math.max(10, u * .7) + 'px');

      // 記下每列目前播放到哪裡，重建後接續，避免整排跳動
      var progress = Array.prototype.map.call(marqueeEl.querySelectorAll('.mq-track'), function (t) {
        var a = trackAnim(t);
        if (!a) return null;
        var d = a.effect.getComputedTiming().duration;
        return d ? (a.currentTime % d) / d : null;
      });

      var html = '';
      for (var r = 0; r < rows; r++) {
        var list = list0.filter(function (g, i) { return i % rows === r; });
        var k = Math.max(1, Math.ceil(W / (list.length * (cw + gap)))); // 份數少時重複，確保塞滿一整排
        var one = '';
        for (var j = 0; j < k; j++) one += list.map(function (g) { return cardHtml(g, ''); }).join('');
        var half = list.length * k * (cw + gap);
        var dur = half / MQ_SPEED;
        html += '<div class="mq-row"><div class="mq-track" data-n="' + list.length * k + '" data-half="' + half + '"' +
          ' data-dir="' + (r % 2 ? 'reverse' : 'normal') + '"' +
          ' style="--mq-shift:-' + half + 'px;animation-duration:' + dur.toFixed(2) + 's;animation-direction:' + (r % 2 ? 'reverse' : 'normal') + '">' +
          one + one + '</div></div>';
      }
      marqueeEl.innerHTML = html;
      list0.forEach(function (g) { mqShown[g.id] = JSON.stringify(g); });

      // 新禮物：卡片發光並掛上 NEW，用負的 delay 讓重建後動畫接續
      var now = Date.now();
      marqueeEl.querySelectorAll('.gift-card').forEach(function (c) {
        var t = freshAt[c.dataset.id];
        var elapsed = t ? (now - t) / 1000 : Infinity;
        if (elapsed >= FRESH_SEC) return;
        c.classList.add('fresh');
        c.style.setProperty('--fresh-delay', -elapsed + 's');
      });

      marqueeEl.querySelectorAll('.mq-track').forEach(function (t, i) {
        var a = trackAnim(t);
        var p = progress[i] != null ? progress[i] : (i * .37) % 1; // 各列錯開起點
        if (a) a.currentTime = p * a.effect.getComputedTiming().duration;
      });
    }

    // 已在牆上的禮物內容改變（例如被公佈）：只換掉那幾張卡片
    function patchMarqueeCard(g) {
      marqueeEl.querySelectorAll('.gift-card[data-id="' + g.id + '"]').forEach(function (old) {
        var tmp = document.createElement('div');
        tmp.innerHTML = cardHtml(g, '');
        var el = tmp.firstChild;
        if (old.classList.contains('fresh')) el.classList.add('fresh');
        el.setAttribute('style', old.getAttribute('style') || '');
        old.replaceWith(el);
      });
      mqShown[g.id] = JSON.stringify(g);
    }

    function updateMarquee() {
      var ids = gifts.map(function (g) { return g.id; });
      var removed = Object.keys(mqShown).some(function (id) { return ids.indexOf(Number(id)) === -1; });
      if (removed || !marqueeEl.querySelector('.mq-track')) return buildMarquee();
      gifts.forEach(function (g) {
        if (pending.has(g.id)) return;
        var j = JSON.stringify(g);
        if (mqShown[g.id] === undefined) buildMarquee();   // 不該發生：保險起見重建
        else if (mqShown[g.id] !== j) patchMarqueeCard(g);
      });
    }

    // 在畫面中央附近的位置讓出空位，插入新卡片；回傳看得到的那張（尚未顯示）
    function insertMarqueeCard(g) {
      var tracks = Array.prototype.slice.call(marqueeEl.querySelectorAll('.mq-track'));
      var shownCount = Object.keys(mqShown).length + 1;
      if (!tracks.length || tracks.length < wantRows(shownCount)) {
        // 禮物還很少（列數會變）：直接重建，再挑最靠近中央的那張當降落點
        pending.delete(g.id);
        buildMarquee();
        pending.add(g.id);
        var copies = marqueeEl.querySelectorAll('.gift-card[data-id="' + g.id + '"]');
        copies.forEach(function (c) { c.classList.add('landing'); });
        return nearestCenter(copies);
      }
      // 插到卡片最少的那一列
      var t = tracks.reduce(function (a, b) { return Number(b.dataset.n) < Number(a.dataset.n) ? b : a; });
      var n = Number(t.dataset.n);
      var cards = t.children;
      var slot = parseFloat(marqueeEl.style.getPropertyValue('--mq-w')) + parseFloat(marqueeEl.style.getPropertyValue('--mq-gap'));
      var ref = nearestCenter(Array.prototype.slice.call(cards));
      var v = Array.prototype.indexOf.call(cards, ref);
      var other = cards[v < n ? v + n : v - n];
      var x = trackX(t);

      var tmp = document.createElement('div');
      tmp.innerHTML = cardHtml(g, '');
      var hidden = tmp.firstChild;               // 另一半的分身：直接全寬插入（在畫面外）
      tmp.innerHTML = cardHtml(g, 'landing opening');
      var seenCopy = tmp.firstChild;             // 看得到的那張：從 0 寬慢慢撐開
      other.before(hidden);
      ref.before(seenCopy);
      if (v >= n) x -= slot;                     // 分身插在前面那一半，補償位移避免整排跳

      var half = (n + 1) * slot;
      t.dataset.n = n + 1;
      t.dataset.half = half;
      t.style.setProperty('--mq-shift', -half + 'px');
      t.style.animationDuration = (half / MQ_SPEED).toFixed(2) + 's';
      setTrackX(t, x);
      mqShown[g.id] = JSON.stringify(g);
      return seenCopy;
    }

    function nearestCenter(els) {
      var cx = window.innerWidth / 2, best = null, bd = Infinity;
      Array.prototype.forEach.call(els, function (el) {
        var r = el.getBoundingClientRect();
        var d = Math.abs(r.left + r.width / 2 - cx);
        if (d < bd) { bd = d; best = el; }
      });
      return best;
    }

    /* ---------- 新禮物飛入動畫：從 QR code 飛出 → 中央放大 → 飛進牆上的空位 ---------- */
    var pending = new Set();    // 排隊或飛行中的禮物 id
    var flyQueue = [];
    var flyBusy = false;
    var FLY_MS = 2800;

    function enqueueFly(g) {
      if (pending.has(g.id)) return;
      pending.add(g.id);
      flyQueue.push(g.id);
      if (!flyBusy) setTimeout(nextFly, 300);
    }

    function nextFly() {
      var id = flyQueue.shift();
      if (id == null) { flyBusy = false; return; }
      flyBusy = true;
      var g = gifts.find(function (x) { return x.id === id; });
      if (!g) { pending.delete(id); return nextFly(); }       // 已被刪除
      var container = mode === 'all' ? gridEl : marqueeEl;
      var target = mode === 'all'
        ? gridEl.querySelector('.gift-card[data-id="' + id + '"]')
        : insertMarqueeCard(g);
      if (!target || reduceMotion) { land(g, container); return setTimeout(nextFly, 200); }

      var r = target.getBoundingClientRect();
      var w = mode === 'all' ? r.width : parseFloat(marqueeEl.style.getPropertyValue('--mq-w'));
      var h = mode === 'all' ? r.height : parseFloat(marqueeEl.style.getPropertyValue('--mq-h'));
      // 跑馬燈會在飛行期間繼續移動，預估降落時的位置
      var drift = 0;
      if (mode !== 'all') {
        var t = target.parentElement;
        drift = (t.dataset.dir === 'reverse' ? 1 : -1) * MQ_SPEED * FLY_MS / 1000;
      }
      var L = r.left + drift, T = r.top;

      var tmp = document.createElement('div');
      tmp.innerHTML = cardHtml(g, 'flyer fresh');
      var fly = tmp.firstChild;
      var cs = getComputedStyle(container);
      ['--word-size', '--no-size', '--pad'].forEach(function (v) { fly.style.setProperty(v, cs.getPropertyValue(v)); });
      fly.style.cssText += ';left:' + L + 'px;top:' + T + 'px;width:' + w + 'px;height:' + h + 'px';
      document.body.appendChild(fly);

      var q = qrState !== 2 ? qrBox.getBoundingClientRect() : { left: innerWidth / 2, top: innerHeight, width: 0, height: 0 };
      var cx = innerWidth / 2 - (L + w / 2), cy = innerHeight / 2 - (T + h / 2);
      var qx = q.left + q.width / 2 - (L + w / 2), qy = q.top + q.height / 2 - (T + h / 2);
      var S = Math.min(2.2, innerWidth * .42 / w, innerHeight * .5 / h);
      var tf = function (x, y, s, rot) { return 'translate(' + x + 'px,' + y + 'px) scale(' + s + ') rotate(' + rot + 'deg)'; };

      document.body.classList.add('flying');
      var anim = fly.animate([
        { transform: tf(qx, qy, .15, -25), opacity: 0, easing: 'cubic-bezier(.2,.8,.3,1.15)' },
        { transform: tf(cx, cy, S, 3), opacity: 1, offset: .3 },
        { transform: tf(cx, cy, S, 0), opacity: 1, offset: .62, easing: 'cubic-bezier(.55,0,.25,1)' },
        { transform: tf(0, 0, 1, 0), opacity: 1 }
      ], { duration: FLY_MS, fill: 'both' });
      setTimeout(function () { document.body.classList.remove('flying'); }, FLY_MS * .62);
      anim.onfinish = function () {
        fly.remove();
        land(g, container);
        setTimeout(nextFly, 500);
      };
    }

    // 降落：顯示牆上的卡片並開始發光
    function land(g, container) {
      pending.delete(g.id);
      freshAt[g.id] = Date.now();
      var els = container.querySelectorAll('.gift-card[data-id="' + g.id + '"]');
      if (!els.length) { if (mode === 'all') renderGrid(); else buildMarquee(); return; }
      els.forEach(function (el) {
        el.classList.remove('landing', 'opening');
        if (container === marqueeEl) {
          el.classList.add('fresh');
          el.style.setProperty('--fresh-delay', '0s');
        } else {
          el.classList.add('landed');
        }
      });
    }

    function spotCard(g) {
      var n = gifts.indexOf(g) + 1;
      return cardHtml(g, 'spot-card') +
        '<div class="spot-meta"><span>' + n + ' / ' + gifts.length + '</span>' +
        '<span class="spot-bar"><i style="animation-duration:' + carouselSec + 's"></i></span></div>';
    }

    // 只在主持人按 ← → 時放大一份禮物，停留後自動收起，不會接著跳下一份
    function showSpot(step) {
      clearTimeout(spotTimer);
      if (mode !== 'carousel' || !gifts.length || revealOpen) return;
      spotIdx = (((spotIdx + (step || 1)) % gifts.length) + gifts.length) % gifts.length;
      spotEl.innerHTML = spotCard(gifts[spotIdx]);
      spotEl.className = 'spot show';
      carEl.classList.add('spotting');
      spotTimer = setTimeout(hideSpot, carouselSec * 1000);
    }

    function hideSpot() {
      clearTimeout(spotTimer);
      if (!spotEl.classList.contains('show')) return;
      spotEl.className = 'spot hide';
      carEl.classList.remove('spotting');
    }

    /* 背景飄雪 */
    var snowCv = document.getElementById('snow');
    var snowRunning = false, flakes = [];
    function sizeSnow() {
      snowCv.width = carEl.clientWidth;
      snowCv.height = carEl.clientHeight;
    }
    function startSnow() {
      if (snowRunning || reduceMotion) return;
      snowRunning = true;
      sizeSnow();
      var ctx = snowCv.getContext('2d');
      flakes = [];
      for (var i = 0; i < 90; i++) {
        flakes.push({ x: Math.random(), y: Math.random(), r: Math.random() * 2.5 + 1, v: Math.random() * .4 + .2, d: Math.random() * Math.PI * 2 });
      }
      (function frame() {
        if (!snowRunning) return ctx.clearRect(0, 0, snowCv.width, snowCv.height);
        var w = snowCv.width, h = snowCv.height;
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = 'rgba(255,248,232,.5)';
        flakes.forEach(function (f) {
          f.y += f.v / h * 1.6; f.d += .01;
          if (f.y > 1.02) { f.y = -.02; f.x = Math.random(); }
          ctx.beginPath();
          ctx.arc((f.x + Math.sin(f.d) * .01) * w, f.y * h, f.r, 0, Math.PI * 2);
          ctx.fill();
        });
        requestAnimationFrame(frame);
      })();
    }
    function stopSnow() { snowRunning = false; }

    function render(force) {
      if (firstLoad) return;
      countEl.textContent = gifts.length ? '共 ' + gifts.length + ' 份禮物' : '';
      var sig = JSON.stringify(gifts);
      if (!force && sig === lastSig) return;
      lastSig = sig;
      // 剛送出的禮物排隊飛進來
      gifts.forEach(function (g) { if (!seen.has(g.id)) enqueueFly(g); });
      if (mode === 'all') renderGrid();
      else if (force) buildMarquee();
      else updateMarquee();
      gifts.forEach(function (g) { seen.add(g.id); });
    }

    function setMode(m) {
      mode = m;
      try { localStorage.setItem('display_mode', m); } catch (e) {}
      gridEl.hidden = m !== 'all';
      carEl.hidden = m !== 'carousel';
      restartCarousel();
      render(true);
    }

    /* ---------- 模式切換動畫：每張卡片從舊位置滑行、縮放到新位置 ---------- */
    var MORPH_MS = 950;
    var morphing = false;

    // 收集容器裡每份禮物的卡片位置（同一份可能有多張分身）
    function cardRects(container) {
      var map = {};
      container.querySelectorAll('.gift-card[data-id]').forEach(function (el) {
        if (el.classList.contains('landing')) return;
        var r = el.getBoundingClientRect();
        if (r.width < 4 || r.height < 4) return;
        (map[el.dataset.id] = map[el.dataset.id] || []).push({ el: el, r: r });
      });
      return map;
    }
    function onScreen(r) { return r.right > 0 && r.left < innerWidth && r.bottom > 0 && r.top < innerHeight; }
    function nearest(list, r) {
      var cx = r.left + r.width / 2, cy = r.top + r.height / 2, best = list[0], bd = Infinity;
      list.forEach(function (it) {
        var d = Math.hypot(it.r.left + it.r.width / 2 - cx, it.r.top + it.r.height / 2 - cy);
        if (d < bd) { bd = d; best = it; }
      });
      return best;
    }

    function switchMode(m) {
      if (m === mode) return;
      if (morphing || firstLoad || reduceMotion || !gifts.length) return setMode(m);
      var fromEl = mode === 'all' ? gridEl : marqueeEl;
      var toEl = m === 'all' ? gridEl : marqueeEl;
      var from = cardRects(fromEl);

      setMode(m);                                    // 在背後排好新版面
      var tracks = marqueeEl.querySelectorAll('.mq-track');
      tracks.forEach(function (t) { t.style.animationPlayState = 'paused'; }); // 目標位置先固定
      var to = cardRects(toEl);
      toEl.classList.add('morph-hide');
      morphing = true;

      // 配對：每個「畫面上看得到的目標」都要有一張分身飛過去；
      // 格狀 → 跑馬燈：一張分裂到多個位置；跑馬燈 → 格狀：畫面上的多張匯聚到同一格
      var pairs = [];
      Object.keys(to).forEach(function (id) {
        var targets = to[id].filter(function (t) { return onScreen(t.r); });
        var sources = (from[id] || []).filter(function (s) { return onScreen(s.r); });
        if (!targets.length) {
          // 目標都在畫面外（跑馬燈還沒流到的位置）：畫面上的卡片往最近的那個位置滑出去，不要憑空消失
          if (!sources.length) return;
          sources.forEach(function (s) { pairs.push({ id: id, src: s.r, tgt: nearest(to[id], s.r) }); });
          return;
        }
        if (m === 'carousel') {
          targets.forEach(function (t) {
            var s = sources.length ? nearest(sources, t.r) : (from[id] ? nearest(from[id], t.r) : null);
            pairs.push({ id: id, src: s && s.r, tgt: t });
          });
        } else {
          var t = targets[0];
          if (!sources.length && from[id]) sources = [nearest(from[id], t.r)];
          if (!sources.length) pairs.push({ id: id, src: null, tgt: t });
          sources.forEach(function (s) { pairs.push({ id: id, src: s.r, tgt: t }); });
        }
      });
      // 由左上往右下依序出發，形成波浪
      pairs.sort(function (a, b) { return (a.tgt.r.top - b.tgt.r.top) * 2 + (a.tgt.r.left - b.tgt.r.left); });

      var cs = getComputedStyle(toEl);
      var vars = ['--word-size', '--no-size', '--pad', '--fresh-delay'];
      var layer = document.createElement('div');
      layer.className = 'morph-layer';
      document.body.appendChild(layer);
      var stagger = Math.min(18, 380 / Math.max(1, pairs.length));

      var anims = pairs.map(function (p, i) {
        var el = p.tgt.el.cloneNode(true);
        el.classList.remove('landing', 'opening', 'landed', 'new');
        el.classList.add('morph');
        vars.forEach(function (v) { var val = cs.getPropertyValue(v); if (val) el.style.setProperty(v, val); });
        var r = p.tgt.r;
        el.style.left = r.left + 'px'; el.style.top = r.top + 'px';
        el.style.width = r.width + 'px'; el.style.height = r.height + 'px';
        layer.appendChild(el);
        var start;
        if (p.src) {
          var s = Math.sqrt((p.src.width / r.width) * (p.src.height / r.height));
          start = { transform: 'translate(' + (p.src.left - r.left) + 'px,' + (p.src.top - r.top) + 'px) scale(' + s + ')', opacity: 1 };
        } else {
          start = { transform: 'translate(0, 40px) scale(.6)', opacity: 0 };
        }
        return el.animate([start, { transform: 'none', opacity: 1 }], {
          duration: MORPH_MS, delay: i * stagger, easing: 'cubic-bezier(.65, 0, .35, 1)', fill: 'both'
        }).finished;
      });

      Promise.all(anims).then(finish, finish);
      function finish() {
        if (!morphing) return;
        morphing = false;
        // 新版面瞬間顯示（不要淡入），分身剛好疊在同樣位置，所以看起來無縫
        toEl.style.transition = 'none';
        toEl.classList.remove('morph-hide');
        void toEl.offsetWidth;
        toEl.style.transition = '';
        layer.remove();
        marqueeEl.querySelectorAll('.mq-track').forEach(function (t) { t.style.animationPlayState = ''; });
      }
    }

    function restartCarousel() {
      clearTimeout(spotTimer);
      spotEl.className = 'spot';
      carEl.classList.remove('spotting');
      if (mode !== 'carousel') { stopSnow(); return; }
      startSnow();
    }

    // 調整速度：每一列從目前位置接續，只改變流動速度，不會跳動
    function setSpeed(level) {
      speedLevel = Math.min(10, Math.max(1, Math.round(Number(level)) || 3));
      MQ_SPEED = speedLevel * 15;
      marqueeEl.querySelectorAll('.mq-track').forEach(function (t) {
        var x = trackX(t);
        t.style.animationDuration = (Number(t.dataset.half) / MQ_SPEED).toFixed(2) + 's';
        setTrackX(t, x);
      });
    }

    // 套用後台的顯示設定；只在後台改變時才套用，所以現場按 A / C 臨時切換仍有效
    function applyDisplaySettings(st, instant) {
      var sig = (st.displayMode || '') + '|' + (st.speed || '');
      if (sig === lastDisplaySig) return;
      lastDisplaySig = sig;
      if (st.speed) setSpeed(st.speed);
      if ((st.displayMode === 'all' || st.displayMode === 'carousel') && st.displayMode !== mode) {
        if (instant) setMode(st.displayMode); else switchMode(st.displayMode);   // 剛打開頁面時直接切，不播動畫
      }
    }

    function toggleFullscreen() {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
    }
    document.getElementById('fsBtn').addEventListener('click', toggleFullscreen);

    document.addEventListener('keydown', function (e) {
      if (e.target.tagName === 'INPUT') return;
      var k = e.key.toLowerCase();
      if (k === 'a') switchMode('all');
      else if (k === 'c') switchMode('carousel');
      else if (k === 'q') cycleQr();
      else if (k === 'f') toggleFullscreen();
      else if (k === 'h') document.body.classList.toggle('hide-ui');
      else if (k === 'escape' && revealOpen) closeReveal();
      else if (mode === 'carousel' && (k === 'arrowright' || k === 'arrowleft')) {
        showSpot(k === 'arrowright' ? 1 : -1);
      }
    });

    /* ---------- 公佈動畫 ---------- */
    var overlay = null;
    var closeTimer = null;
    var confettiStop = null;

    function showReveal(g) {
      closeReveal();
      revealOpen = true;
      overlay = document.createElement('div');
      overlay.className = 'reveal-overlay';
      var words = g.words.map(function (w, i) {
        return '<li class="' + (i === g.fakeIndex ? 'fake' : '') + '">' + escapeHtml(w) + '</li>';
      }).join('');
      overlay.innerHTML =
        '<canvas></canvas>' +
        '<div class="reveal-card">' +
          '<div class="no">🎁 禮物 #' + g.id + ' 公佈！</div>' +
          '<ul>' + words + '</ul>' +
          '<div class="fake-label">假的是「' + escapeHtml(g.words[g.fakeIndex]) + '」！</div>' +
          '<div class="who">這是 <b>' + escapeHtml(g.name) + '</b> 的禮物！</div>' +
        '</div>' +
        '<div class="reveal-hint">點一下關閉</div>';
      document.body.appendChild(overlay);
      overlay.addEventListener('click', closeReveal);
      setTimeout(function () {
        if (overlay) confettiStop = confetti(overlay.querySelector('canvas'));
      }, 3000);
      closeTimer = setTimeout(closeReveal, 12000);
    }

    function closeReveal() {
      clearTimeout(closeTimer);
      if (confettiStop) { confettiStop(); confettiStop = null; }
      if (overlay) { overlay.remove(); overlay = null; }
      revealOpen = false;
    }

    function confetti(canvas) {
      var ctx = canvas.getContext('2d');
      var W = canvas.width = window.innerWidth;
      var H = canvas.height = window.innerHeight;
      var colors = ['#9b2c2f', '#d9b260', '#f1d996', '#fbf6ea', '#3d6a4e', '#b48a3a'];
      var parts = [];
      for (var i = 0; i < 220; i++) {
        parts.push({
          x: W / 2 + (Math.random() - .5) * 200, y: H * .45,
          vx: (Math.random() - .5) * 18, vy: -Math.random() * 18 - 6,
          r: Math.random() * 6 + 4, rot: Math.random() * 6, vr: (Math.random() - .5) * .3,
          c: colors[(Math.random() * colors.length) | 0]
        });
      }
      var running = true;
      (function frame() {
        if (!running) return;
        ctx.clearRect(0, 0, W, H);
        parts.forEach(function (p) {
          p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
          ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
          ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2);
          ctx.restore();
        });
        if (parts.some(function (p) { return p.y < H + 20; })) requestAnimationFrame(frame);
      })();
      return function () { running = false; };
    }

    /* ---------- 輪詢 ---------- */
    async function poll() {
      try {
        var data = await API.get('public');
        gifts = data.gifts || [];
        var st = data.state || {};
        var revealAt = Number(st.revealAt) || 0;
        var resetAt = Number(st.resetAt) || 0;
        // 只有 resetAt 變大才算重置（舊版後端公佈時會把 resetAt 洗掉，不能誤判成重置）
        if (resetAt > lastResetAt) { if (!firstLoad) seen.clear(); lastResetAt = resetAt; }
        if (firstLoad) {
          // 第一次載入不重播舊的公佈
          lastRevealAt = revealAt;
          gifts.forEach(function (g) { seen.add(g.id); });
          firstLoad = false;
          render(true);
          applyDisplaySettings(st, true);
        } else {
          applyDisplaySettings(st);
          render(false);
          if (revealAt > lastRevealAt) {
            lastRevealAt = revealAt;
            var g = gifts.find(function (x) { return x.id === st.revealId; });
            if (g && g.revealed) showReveal(g);
          }
        }
        statusEl.textContent = '● 已連線 ' + new Date().toLocaleTimeString();
      } catch (e) {
        statusEl.textContent = '⚠ ' + e.message;
        if (firstLoad) gridEl.innerHTML = '<div class="empty">' + escapeHtml(e.message) + '</div>';
      } finally {
        setTimeout(poll, cfg.POLL_MS || 3000);
      }
    }

    setMode(mode);
    poll();

    // 網路字型載入後字寬會變，重新排版一次避免文字溢出
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(function () {
        if (firstLoad) return;
        if (mode === 'all') fitGrid(); else buildMarquee();
      });
    }
  </script>
</body>
</html>
