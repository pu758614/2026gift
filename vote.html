<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>交換禮物 — 投票</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap">
  <link rel="stylesheet" href="assets/style.css?v=20">
</head>
<body>
  <main class="form-wrap vote-wrap">
    <h1><span class="emoji">🗳️</span> 禮物投票</h1>
    <p class="sub">每個獎項可以選 1～3 份禮物</p>

    <section class="panel vote-closed" id="closedPanel">
      <div class="big">⏳</div>
      <h2 id="closedTitle">載入中…</h2>
      <p id="closedMsg"></p>
    </section>

    <section class="panel" id="formPanel" hidden>
      <div class="group">
        <label class="field" for="name">你的名字</label>
        <input type="text" id="name" maxlength="30" placeholder="例如：王小明" autocomplete="name">
      </div>
      <div class="vote-search">
        <input type="text" id="search" placeholder="🔍 搜尋編號、名字或特徵">
      </div>
      <div id="cats"></div>
      <div class="vote-bar">
        <p class="error" id="err"></p>
        <button type="button" class="submit-btn" id="submitBtn">送出投票 🎄</button>
      </div>
    </section>

    <section class="panel success" id="donePanel" hidden>
      <div class="big">🎉</div>
      <h2>投票完成！</h2>
      <p id="doneMsg"></p>
      <div class="vote-done-list" id="doneList"></div>
      <p style="color:var(--muted);font-size:14px">投票結束前都可以修改</p>
      <button type="button" class="ghost" id="editBtn" style="background:#eee;color:#333">修改我的投票</button>
    </section>
  </main>

  <script src="assets/config.js"></script>
  <script src="assets/api.js"></script>
  <script>
    var CATS = [
      { key: 'surprise', label: '🎁 最驚喜的禮物' },
      { key: 'funny', label: '😂 最搞笑的禮物' },
      { key: 'want', label: '💝 最想收到的禮物' }
    ];
    var MAX = 3;
    var $ = function (id) { return document.getElementById(id); };

    var gifts = [];
    var picks = { surprise: [], funny: [], want: [] };
    var open = null;
    var round = 0;           // 投票回合（後台清空投票後會變）
    var view = 'closed';     // closed | form | done
    var saved = null;        // 上次送出的內容 { name, picks }
    try { saved = JSON.parse(localStorage.getItem('vote_saved') || 'null'); } catch (e) {}
    try { $('name').value = (saved && saved.name) || localStorage.getItem('vote_name') || ''; } catch (e) {}

    function show(v) {
      view = v;
      $('closedPanel').hidden = v !== 'closed';
      $('formPanel').hidden = v !== 'form';
      $('donePanel').hidden = v !== 'done';
    }

    function giftById(id) { return gifts.find(function (g) { return g.id === id; }); }

    function wordsHtml(g) {
      return g.words.map(function (w, i) {
        return i === g.fakeIndex ? '<s>' + escapeHtml(w) + '</s>' : escapeHtml(w);
      }).join('・');
    }

    function renderForm() {
      var q = $('search').value.trim().toLowerCase();
      $('cats').innerHTML = CATS.map(function (c) {
        var sel = picks[c.key];
        var full = sel.length >= MAX;
        var list = gifts.filter(function (g) {
          if (!q || sel.indexOf(g.id) !== -1) return true;   // 已選的永遠顯示
          return ('#' + g.id + ' ' + g.name + ' ' + g.words.join(' ')).toLowerCase().indexOf(q) !== -1;
        });
        var opts = list.map(function (g) {
          var on = sel.indexOf(g.id) !== -1;
          return '<button type="button" class="vote-opt' + (on ? ' on' : '') + '" data-cat="' + c.key + '" data-id="' + g.id + '"' +
            (!on && full ? ' disabled' : '') + '>' +
            '<span class="chk">✓</span>' +
            '<span class="body"><div class="who">' + escapeHtml(g.name) + '<small>#' + g.id + '</small></div>' +
            '<div class="ws">' + wordsHtml(g) + '</div></span></button>';
        }).join('') || '<p style="color:var(--muted)">找不到符合的禮物</p>';
        return '<div class="vote-cat"><div class="vote-cat-head"><h2>' + c.label + '</h2>' +
          '<span class="picked' + (full ? ' full' : '') + '">已選 ' + sel.length + '/' + MAX + '</span></div>' +
          '<div class="vote-list">' + opts + '</div></div>';
      }).join('');
    }

    $('cats').addEventListener('click', function (e) {
      var b = e.target.closest('.vote-opt');
      if (!b || b.disabled) return;
      var list = picks[b.dataset.cat];
      var id = Number(b.dataset.id);
      var i = list.indexOf(id);
      if (i !== -1) list.splice(i, 1);
      else if (list.length < MAX) list.push(id);
      $('err').textContent = '';
      renderForm();
    });
    $('search').addEventListener('input', renderForm);
    $('name').addEventListener('input', function () { $('err').textContent = ''; });

    function renderDone() {
      $('doneMsg').textContent = saved.name + '，謝謝你的投票！';
      $('doneList').innerHTML = CATS.map(function (c) {
        var items = (saved.picks[c.key] || []).map(function (id) {
          var g = giftById(id);
          return '<div>#' + id + ' ' + (g ? escapeHtml(g.name) + ' 的禮物' : '') + '</div>';
        }).join('');
        return '<h3>' + c.label + '</h3>' + items;
      }).join('');
    }

    $('editBtn').addEventListener('click', function () {
      if (saved) picks = JSON.parse(JSON.stringify(saved.picks));
      prune();
      renderForm();
      show('form');
      window.scrollTo(0, 0);
    });

    // 禮物被刪除時，從已選清單移除
    function prune() {
      CATS.forEach(function (c) {
        picks[c.key] = (picks[c.key] || []).filter(function (id) { return giftById(id); });
      });
    }

    $('submitBtn').addEventListener('click', async function () {
      var name = $('name').value.trim();
      if (!name) { $('err').textContent = '請填寫你的名字'; $('name').focus(); return; }
      var missing = CATS.filter(function (c) { return !picks[c.key].length; });
      if (missing.length) { $('err').textContent = '還沒選：' + missing.map(function (c) { return c.label.replace(/^\S+\s/, ''); }).join('、'); return; }
      var btn = $('submitBtn');
      btn.disabled = true;
      btn.textContent = '送出中…';
      try {
        var res = await API.post({ action: 'vote', name: name, picks: picks });
        saved = { name: name, picks: JSON.parse(JSON.stringify(picks)), round: round };
        try {
          localStorage.setItem('vote_saved', JSON.stringify(saved));
          localStorage.setItem('vote_name', name);
        } catch (e) {}
        renderDone();
        show('done');
        if (res.updated) $('doneMsg').textContent = name + '，已更新你的投票！';
        window.scrollTo(0, 0);
      } catch (e) {
        $('err').textContent = e.message;
        if (/沒有開放/.test(e.message)) check();
      } finally {
        btn.disabled = false;
        btn.textContent = '送出投票 🎄';
      }
    });

    async function check() {
      try {
        var data = await API.get('voteOptions');
        // 投票被清空過：之前記住的投票作廢
        if (saved && (saved.round || 0) !== (data.round || 0)) {
          saved = null;
          picks = { surprise: [], funny: [], want: [] };
          try { localStorage.removeItem('vote_saved'); } catch (e) {}
          if (view === 'done') view = 'closed';
        }
        var wasOpen = open;
        open = !!data.open;
        round = data.round || 0;
        if (!open) {
          $('closedTitle').textContent = wasOpen === null || !saved ? '投票還沒開始' : '投票已經結束';
          $('closedMsg').textContent = wasOpen === null || !saved ? '主持人開始投票後，這一頁會自動切換。' : '謝謝參與，請看大螢幕開票！';
          show('closed');
          return;
        }
        var sig = JSON.stringify(data.gifts);
        var changed = sig !== JSON.stringify(gifts);
        gifts = data.gifts;
        if (view === 'closed') {
          if (saved) { renderDone(); show('done'); }
          else { prune(); renderForm(); show('form'); }
        } else if (changed) {
          prune();
          if (view === 'form') renderForm(); else renderDone();
        }
      } catch (e) {
        if (view === 'closed') {
          $('closedTitle').textContent = '連線失敗';
          $('closedMsg').textContent = e.message;
        }
      }
    }

    check();
    setInterval(check, 5000);
  </script>
</body>
</html>
