<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>交換禮物 — 管理後台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap">
  <link rel="stylesheet" href="assets/style.css?v=20">
</head>
<body>
  <main class="admin">
    <section class="panel login" id="loginPanel">
      <h2 style="margin-top:0">🔒 管理後台</h2>
      <label class="field" for="pw">請輸入密碼</label>
      <div class="row">
        <input type="password" id="pw" autocomplete="current-password">
        <button id="loginBtn">登入</button>
      </div>
      <p class="error" id="loginErr"></p>
    </section>

    <section id="mainPanel" hidden>
      <h1><span class="emoji">🎅</span> 管理後台</h1>
      <div class="top">
        <button class="ghost small" id="refreshBtn">重新整理</button>
        <button class="ghost small" onclick="window.open('display.html', '_blank')">開啟大螢幕 ↗</button>
        <span class="meta" id="meta"></span>
        <span class="spacer"></span>
        <button class="small ghost" id="logoutBtn">登出</button>
        <button class="small" id="resetBtn">全部重置</button>
      </div>
      <section class="panel settings" id="settingsPanel">
        <h2>📺 大螢幕顯示</h2>
        <div class="setting-row">
          <span class="setting-label">模式</span>
          <div class="seg" id="modeSeg">
            <button class="small" data-mode="all">全部顯示</button>
            <button class="small" data-mode="carousel">動態展示</button>
          </div>
        </div>
        <div class="setting-row" id="speedRow">
          <span class="setting-label">速度</span>
          <span class="speed-hint">慢</span>
          <input type="range" id="speedInput" min="1" max="10" step="1" value="3">
          <span class="speed-hint">快</span>
          <b id="speedVal">3</b>
        </div>
        <p class="setting-msg" id="settingsMsg">修改後大螢幕約 3 秒內會跟著切換。</p>
      </section>

      <section class="panel settings" id="votePanel">
        <h2>🗳️ 投票</h2>
        <div class="setting-row">
          <span class="vote-status" id="voteStatus">未開始</span>
          <span class="meta" id="voterCount" style="color:var(--muted)"></span>
          <span style="flex:1"></span>
          <button class="small ghost" style="color:#5a4532" onclick="window.open('vote.html', '_blank')">開啟投票頁 ↗</button>
          <button class="small gold" id="voteToggle">開始投票</button>
        </div>
        <div class="tally-grid" id="tallies"></div>
        <details class="voters" id="votersBox">
          <summary>投票名單</summary>
          <div id="voters"></div>
        </details>
        <div class="setting-row" style="margin-top:10px;margin-bottom:0">
          <p class="setting-msg" id="voteMsg" style="flex:1">開始投票後，大螢幕右下角的 QR code 會換成投票頁。</p>
          <button class="small ghost" style="color:var(--berry)" id="clearVotesBtn">清空投票</button>
        </div>
      </section>

      <p class="error" id="err"></p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>#</th><th>姓名</th><th>三個特徵（紅色劃線 = 假的）</th><th>狀態</th><th>操作</th></tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="assets/config.js"></script>
  <script src="assets/api.js"></script>
  <script>
    var password = '';
    try { password = sessionStorage.getItem('admin_pw') || ''; } catch (e) {}
    var refreshTimer = null;
    var busy = false;

    var $ = function (id) { return document.getElementById(id); };

    function toast(msg) {
      var t = document.createElement('div');
      t.className = 'toast';
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(function () { t.remove(); }, 2200);
    }

    async function login() {
      $('loginErr').textContent = '';
      var pw = $('pw').value;
      if (!pw) return;
      $('loginBtn').disabled = true;
      try {
        await API.post({ action: 'login', password: pw });
        password = pw;
        try { sessionStorage.setItem('admin_pw', pw); } catch (e) {}
        enter();
      } catch (e) {
        $('loginErr').textContent = e.message;
      } finally {
        $('loginBtn').disabled = false;
      }
    }

    function enter() {
      $('loginPanel').hidden = true;
      $('mainPanel').hidden = false;
      load();
      clearInterval(refreshTimer);
      refreshTimer = setInterval(function () { if (!busy) load(); }, 5000);
    }

    function logout() {
      password = '';
      try { sessionStorage.removeItem('admin_pw'); } catch (e) {}
      clearInterval(refreshTimer);
      $('mainPanel').hidden = true;
      $('loginPanel').hidden = false;
      $('pw').value = '';
    }

    async function load() {
      try {
        var data = await API.post({ action: 'adminList', password: password });
        render(data.gifts || []);
        showSettings(data.state || {});
        showVotes(data.votes, data.state || {});
        $('err').textContent = '';
        $('meta').textContent = '共 ' + data.gifts.length + ' 筆・更新於 ' + new Date().toLocaleTimeString();
      } catch (e) {
        if (e.message === '密碼錯誤') return logout();
        $('err').textContent = e.message;
      }
    }

    var lastSig = '';
    function render(gifts, force) {
      // 資料沒變就不重繪，避免按下按鈕的瞬間表格被換掉
      var sig = JSON.stringify(gifts);
      if (!force && sig === lastSig) return;
      lastSig = sig;
      if (!gifts.length) {
        $('tbody').innerHTML = '<tr><td colspan="5" style="text-align:center;color:#888;padding:24px">目前沒有資料</td></tr>';
        return;
      }
      $('tbody').innerHTML = gifts.map(function (g) {
        var words = g.words.map(function (w, i) {
          return '<span class="w' + (i === g.fakeIndex ? ' fake' : '') + '">' + escapeHtml(w) + '</span>';
        }).join('');
        return '<tr>' +
          '<td><b>' + g.id + '</b></td>' +
          '<td>' + escapeHtml(g.name) + '</td>' +
          '<td>' + words + '</td>' +
          '<td>' + (g.revealed ? '<span class="tag">已公佈</span>' : '') + '</td>' +
          '<td class="actions">' +
            '<button class="small gold" data-act="reveal" data-id="' + g.id + '">' + (g.revealed ? '再公佈一次' : '公佈') + '</button>' +
            '<button class="small" data-act="delete" data-id="' + g.id + '" data-name="' + escapeHtml(g.name) + '">刪除</button>' +
          '</td></tr>';
      }).join('');
    }

    async function act(payload, okMsg) {
      busy = true;
      try {
        await API.post(Object.assign({ password: password }, payload));
        toast(okMsg);
        lastSig = ''; // 強制重繪，恢復被停用的按鈕
        await load();
      } catch (e) {
        $('err').textContent = e.message;
        lastSig = '';
        load();
      } finally {
        busy = false;
      }
    }

    $('tbody').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-act]');
      if (!b) return;
      var id = Number(b.dataset.id);
      if (b.dataset.act === 'reveal') {
        b.disabled = true;
        act({ action: 'reveal', id: id }, '已公佈禮物 #' + id + '，請看大螢幕！');
      } else if (b.dataset.act === 'delete') {
        if (!confirm('確定要刪除 #' + id + '（' + b.dataset.name + '）嗎？')) return;
        b.disabled = true;
        act({ action: 'delete', id: id }, '已刪除 #' + id);
      }
    });

    /* ---------- 大螢幕顯示設定 ---------- */
    var settingsBusy = false;   // 正在送出或拖動滑桿時，不要被自動更新蓋掉
    var speedTimer = null;

    function showSettings(st) {
      if (settingsBusy) return;
      var m = st.displayMode || 'all';
      var s = Number(st.speed) || (window.APP_CONFIG && APP_CONFIG.MARQUEE_SPEED) || 3;
      document.querySelectorAll('#modeSeg button').forEach(function (b) {
        b.classList.toggle('active', b.dataset.mode === m);
      });
      $('speedInput').value = s;
      $('speedVal').textContent = s;
      $('speedRow').classList.toggle('dim', m !== 'carousel');
    }

    async function saveSettings(patch, okMsg) {
      settingsBusy = true;
      $('settingsMsg').textContent = '儲存中…';
      $('settingsMsg').className = 'setting-msg';
      try {
        var res = await API.post(Object.assign({ action: 'setDisplay', password: password }, patch));
        settingsBusy = false;
        showSettings(res.state || {});
        $('settingsMsg').textContent = okMsg + '，大螢幕約 3 秒內會跟著切換。';
      } catch (e) {
        settingsBusy = false;
        $('settingsMsg').className = 'setting-msg error';
        $('settingsMsg').textContent = e.message === '未知的動作'
          ? '後端還是舊版：請把 apps-script/Code.gs 貼到 Apps Script 並「部署 → 管理部署作業 → 新版本」。'
          : e.message;
        load();
      }
    }

    $('modeSeg').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-mode]');
      if (!b || b.classList.contains('active')) return;
      document.querySelectorAll('#modeSeg button').forEach(function (x) { x.classList.toggle('active', x === b); });
      $('speedRow').classList.toggle('dim', b.dataset.mode !== 'carousel');
      saveSettings({ mode: b.dataset.mode }, '已切換為「' + b.textContent + '」');
    });

    // 拖動時即時顯示數字，停手 0.4 秒後才送出，避免連續送出很多次
    $('speedInput').addEventListener('input', function () {
      settingsBusy = true;
      $('speedVal').textContent = this.value;
      clearTimeout(speedTimer);
      var v = Number(this.value);
      speedTimer = setTimeout(function () { saveSettings({ speed: v }, '速度已設為 ' + v); }, 400);
    });

    /* ---------- 投票 ---------- */
    var CATS = [
      { key: 'surprise', label: '🎁 最驚喜的禮物' },
      { key: 'funny', label: '😂 最搞笑的禮物' },
      { key: 'want', label: '💝 最想收到的禮物' }
    ];
    var votingOpen = false;
    var voteBusy = false;
    var lastVoteSig = '';

    function showVotes(votes, st) {
      if (voteBusy) return;
      if (!votes) {
        $('voteMsg').className = 'setting-msg error';
        $('voteMsg').textContent = '後端還是舊版：請把 apps-script/Code.gs 貼到 Apps Script 並「部署 → 管理部署作業 → 新版本」。';
        return;
      }
      votingOpen = !!st.votingOpen;
      var results = st.results || {};
      var sig = JSON.stringify([votes, votingOpen, Object.keys(results)]);
      if (sig === lastVoteSig) return;
      lastVoteSig = sig;

      var everVoted = votes.voterCount > 0 || Object.keys(results).length > 0;
      $('voteStatus').textContent = votingOpen ? '投票中' : (everVoted ? '已結束' : '未開始');
      $('voteStatus').className = 'vote-status' + (votingOpen ? ' open' : '');
      $('voterCount').textContent = '已有 ' + votes.voterCount + ' 人投票';
      $('voteToggle').textContent = votingOpen ? '結束投票' : (everVoted ? '重新開放投票' : '開始投票');
      $('voteToggle').className = 'small ' + (votingOpen ? '' : 'gold');

      $('tallies').innerHTML = CATS.map(function (c) {
        var list = votes.tallies[c.key] || [];
        var max = list.length ? list[0].votes : 1;
        var rows = list.slice(0, 10).map(function (t) {
          return '<li><div class="lbl"><span>#' + t.id + ' ' + escapeHtml(t.name) + '</span><b>' + t.votes + ' 票</b></div>' +
            '<div class="bar"><i style="width:' + (t.votes / max * 100) + '%"></i></div></li>';
        }).join('');
        var done = !!results[c.key];
        return '<div class="tally"><h3>' + c.label + '</h3>' +
          (rows ? '<ol>' + rows + '</ol>' : '<p class="none">還沒有票</p>') +
          '<button class="small ' + (done ? 'ghost' : 'gold') + '"' + (done ? ' style="color:#5a4532"' : '') +
          ' data-cat="' + c.key + '">' + (done ? '🔁 重新開票' : '🏆 開票') + '</button></div>';
      }).join('');

      var giftName = {};
      CATS.forEach(function (c) { (votes.tallies[c.key] || []).forEach(function (t) { giftName[t.id] = t.name; }); });
      var fmt = function (ids) { return ids.map(function (id) { return '#' + id + (giftName[id] ? ' ' + escapeHtml(giftName[id]) : ''); }).join('、'); };
      $('voters').innerHTML = votes.voters.length
        ? '<table><thead><tr><th>投票者</th><th>最驚喜</th><th>最搞笑</th><th>最想收到</th></tr></thead><tbody>' +
          votes.voters.map(function (v) {
            return '<tr><td><b>' + escapeHtml(v.name) + '</b></td><td>' + fmt(v.surprise) + '</td><td>' + fmt(v.funny) + '</td><td>' + fmt(v.want) + '</td></tr>';
          }).join('') + '</tbody></table>'
        : '<p style="color:var(--muted)">還沒有人投票</p>';
      $('votersBox').querySelector('summary').textContent = '投票名單（' + votes.voters.length + ' 人）';
    }

    async function voteAct(payload, okMsg) {
      voteBusy = true;
      $('voteMsg').className = 'setting-msg';
      $('voteMsg').textContent = '處理中…';
      try {
        await API.post(Object.assign({ password: password }, payload));
        $('voteMsg').textContent = okMsg;
        toast(okMsg);
      } catch (e) {
        $('voteMsg').className = 'setting-msg error';
        $('voteMsg').textContent = e.message === '未知的動作'
          ? '後端還是舊版：請把 apps-script/Code.gs 貼到 Apps Script 並「部署 → 管理部署作業 → 新版本」。'
          : e.message;
      } finally {
        voteBusy = false;
        lastVoteSig = '';
        load();
      }
    }

    $('voteToggle').addEventListener('click', function () {
      if (votingOpen && !confirm('確定要結束投票嗎？結束後大家就不能再投或改票。')) return;
      this.disabled = true;
      var btn = this;
      voteAct({ action: 'setVoting', open: !votingOpen }, votingOpen ? '投票已結束' : '投票開始！大螢幕 QR code 已換成投票頁')
        .then(function () { btn.disabled = false; });
    });

    $('tallies').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-cat]');
      if (!b) return;
      var c = CATS.find(function (x) { return x.key === b.dataset.cat; });
      var msg = votingOpen
        ? '開票會先結束投票（大家不能再改票），確定要開「' + c.label + '」嗎？'
        : '確定要在大螢幕開「' + c.label + '」的票嗎？';
      if (!confirm(msg)) return;
      b.disabled = true;
      voteAct({ action: 'revealResult', cat: c.key }, '已開票：' + c.label + '，請看大螢幕！');
    });

    $('clearVotesBtn').addEventListener('click', function () {
      var ans = prompt('這會刪除所有投票與開票結果，無法復原！\n請輸入 CLEAR 確認：');
      if (ans !== 'CLEAR') return;
      voteAct({ action: 'clearVotes' }, '已清空投票');
    });

    $('resetBtn').addEventListener('click', function () {
      var ans = prompt('這會刪除所有人的禮物資料與投票，無法復原！\n請輸入 RESET 確認：');
      if (ans !== 'RESET') return;
      act({ action: 'reset' }, '已全部重置');
    });

    $('loginBtn').addEventListener('click', login);
    $('pw').addEventListener('keydown', function (e) { if (e.key === 'Enter') login(); });
    $('refreshBtn').addEventListener('click', load);
    $('logoutBtn').addEventListener('click', logout);

    if (password) enter();
  </script>
</body>
</html>
